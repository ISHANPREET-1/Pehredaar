AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Pehredaar Phase 4: DynamoDB, S3 snapshots, SQS scan queue, the dispatcher and worker Lambdas,
  and an EventBridge Scheduler rule that invokes the dispatcher every 6 hours. The API Lambda,
  the notifier and the frontend are later phases, not built here.

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 256
    Environment:
      Variables:
        PEHREDAAR_REGION: !Ref AWS::Region
        PEHREDAAR_TABLE_NAME: !Ref PehredaarTable
        PEHREDAAR_BUCKET_NAME: !Ref SnapshotsBucket
        PEHREDAAR_QUEUE_URL: !Ref ScanQueue

Resources:
  # ---------------------------------------------------------------------
  # DynamoDB: single table, per CLAUDE.md section 6.
  # ---------------------------------------------------------------------
  PehredaarTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: pehredaar
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  # ---------------------------------------------------------------------
  # S3: gzipped HTML snapshots and scan metadata, per CLAUDE.md section 6.
  # ---------------------------------------------------------------------
  SnapshotsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub pehredaar-snapshots-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireSnapshotsAfter90Days
            Status: Enabled
            ExpirationInDays: 90

  # ---------------------------------------------------------------------
  # SQS: one message per domain, DLQ after 2 failed receives.
  # ---------------------------------------------------------------------
  ScanDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: pehredaar-scan-dlq
      MessageRetentionPeriod: 1209600 # 14 days, the maximum

  ScanQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: pehredaar-scan-queue
      VisibilityTimeout: 360 # 6x the worker's 60s timeout, per AWS's own guidance for SQS to Lambda
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ScanDLQ.Arn
        maxReceiveCount: 2

  # ---------------------------------------------------------------------
  # Dispatcher: EventBridge Scheduler -> reads DynamoDB -> writes to SQS.
  # Read only on DynamoDB, send only on SQS. No S3 access at all.
  # ---------------------------------------------------------------------
  DispatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: pehredaar-dispatcher
      CodeUri: src/
      Handler: pehredaar.handlers.dispatcher.handler
      Timeout: 30
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PehredaarTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ScanQueue.QueueName

  DispatcherScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeDispatcher
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt DispatcherFunction.Arn

  DispatcherSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: pehredaar-dispatcher-every-6h
      Description: Invokes the dispatcher every 6 hours, per CLAUDE.md section 4.
      ScheduleExpression: rate(6 hours)
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt DispatcherFunction.Arn
        RoleArn: !GetAtt DispatcherScheduleRole.Arn

  # ---------------------------------------------------------------------
  # Worker: SQS -> fetch + detect (Phase 1-3 code, unchanged) -> S3 + DynamoDB.
  # Write only on DynamoDB (PutItem/UpdateItem, never dynamodb:*), write only
  # on S3 (PutObject only), plus the SQS poll permissions the event source
  # mapping itself needs.
  # ---------------------------------------------------------------------
  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: pehredaar-worker
      CodeUri: src/
      Handler: pehredaar.handlers.worker.handler
      Timeout: 60
      MemorySize: 512
      ReservedConcurrentExecutions: 20
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref PehredaarTable
        - SQSPollerPolicy:
            QueueName: !GetAtt ScanQueue.QueueName
        - Statement:
            - Sid: WriteSnapshotsOnly
              Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub "${SnapshotsBucket.Arn}/*"
      Events:
        ScanQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt ScanQueue.Arn
            BatchSize: 1

Outputs:
  TableName:
    Value: !Ref PehredaarTable
  SnapshotsBucketName:
    Value: !Ref SnapshotsBucket
  ScanQueueUrl:
    Value: !Ref ScanQueue
  ScanDLQUrl:
    Value: !Ref ScanDLQ
  DispatcherFunctionName:
    Value: !Ref DispatcherFunction
  WorkerFunctionName:
    Value: !Ref WorkerFunction
